[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warnsync-mcp"
version = "0.1.0"
description = "Reference MCP serving layer for a versioned, asynchronously synchronized document corpus (WarnSync)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omkar Pakki" }]
keywords = ["mcp", "model-context-protocol", "rag", "incremental-indexing", "fda", "regulatory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
# mcp 2.x only: the server is built on MCPServer and the subscriptions/listen
# machinery (SEP-2575), neither of which exists in the 1.x SDK.
dependencies = ["mcp>=2.1,<3", "anyio>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
warnsync-mcp = "warnsync_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/omkarpakki/warnsync-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/warnsync_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
